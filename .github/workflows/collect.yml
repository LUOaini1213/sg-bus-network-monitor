name: collect speed bands
# DataMall speed bands (288 paged calls) and one Traffic Incidents poll every 15 minutes, 06:30-10:00 Singapore
# time on weekdays, from ONE job per morning that loops: pull, commit and push, wait for the next 15-minute slot.
# GitHub delays and drops scheduled runs (on 16 October 2026 only the 08:36 and 08:50 SGT ones of fifteen ran; on
# 19 October the first morning run started at 08:14), so the morning trigger fires more than two hours before the
# window and three backups follow at odd minutes: 20:10, 21:02, 21:51 and 22:41 UTC from Sunday to Thursday night are
# 04:10, 05:02, 05:51 and 06:41 SGT (Singapore is UTC+08:00, no daylight saving). The job waits for 06:30, and
# src/collect.py gate ends the loop at most 350 minutes after the job started, inside the 355-minute timeout.
# A backup that fires while the loop runs waits in the concurrency group and then finds every slot taken in the
# day's manifest; a backup that starts first runs the loop itself. Every night one more job loops on the hour from
# 22:00 to 05:00 SGT for the bus-priority screen's free-flow night reference (single night pulls at 01:10 and 03:10
# were dropped or started after 05:00 on 16-20 October). Its trigger fires at 21:07 SGT and two backups follow at
# 22:37 and 00:13 (13:07, 14:37 and 16:13 UTC): a job's last pull is at most 350 minutes after it started, and the
# backup waiting in the group takes the night's remaining slots. The gate tells night from morning by the cron that
# fired; night pulls after midnight go in the next day's folder, so both days are checked out. The gate decides in
# Singapore time and skips public-holiday mornings (demand.HOLIDAYS_2026). Snapshots go to the data-collect branch.
on:
  schedule:
    - cron: "10 20 * * 0-4"      # 04:10 SGT: the morning loop (waits for 06:30)
    - cron: "2 21 * * 0-4"       # 05:02 SGT: backup
    - cron: "51 21 * * 0-4"      # 05:51 SGT: backup
    - cron: "41 22 * * 0-4"      # 06:41 SGT: backup
    - cron: "7 13 * * *"         # 21:07 SGT: the night loop (waits for 22:00), every night
    - cron: "37 14 * * *"        # 22:37 SGT: night backup
    - cron: "13 16 * * *"        # 00:13 SGT: night backup
  workflow_dispatch:   # a manual run always pulls, inside the windows or not
    inputs:
      iterations:
        description: "Pulls in the loop"
        default: "1"
      every_minutes:
        description: "Minutes between pulls"
        default: "15"
      dry_run:
        description: "Run the loop and its schedule without calling DataMall or committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-speed-bands   # one pull at a time, and one writer on data-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # JOB_TIMEOUT_MIN in src/collect.py; GitHub-hosted jobs stop at 360
    steps:
      - name: Job start (for the timeout bound)
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy pandas duckdb
      - name: Plan the loop (weekday morning, night or manual)
        id: gate
        env:
          ITERATIONS: ${{ inputs.iterations || '1' }}
          EVERY_MIN: ${{ inputs.every_minutes || '15' }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB_START: ${{ steps.t0.outputs.epoch }}
        run: python code/src/collect.py gate --schedule "$SCHEDULE" --job-start "$JOB_START" ${{ github.event_name == 'workflow_dispatch' && '--force --iterations "$ITERATIONS" --every "$((EVERY_MIN * 60))"' || '' }}
      - name: Check out data-collect (today's folders only)
        if: steps.gate.outputs.collect == 'true'
        uses: actions/checkout@v4
        with:
          ref: data-collect
          path: store
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            data/raw/speedbands/${{ steps.gate.outputs.day }}
            data/raw/speedbands/${{ steps.gate.outputs.day2 }}
            data/raw/speedbands/links
            data/raw/incidents/${{ steps.gate.outputs.day }}
            data/raw/incidents/${{ steps.gate.outputs.day2 }}
      - name: Pull, commit and push, then wait for the next slot
        if: steps.gate.outputs.collect == 'true'
        env:
          LTA_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
          START: ${{ steps.gate.outputs.start }}
          UNTIL: ${{ steps.gate.outputs.until }}
          EVERY: ${{ steps.gate.outputs.every }}
          DAY: ${{ steps.gate.outputs.day }}
          DAY2: ${{ steps.gate.outputs.day2 }}
          GRACE: ${{ steps.gate.outputs.grace }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          git -C store config user.name "github-actions[bot]"
          git -C store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {  # one commit per pull, pushed at once, so a failure later in the morning loses nothing
            ( cd store
              [ -d data ] || { echo "the pull wrote no files"; return 0; }
              git add -A data
              if git diff --cached --quiet; then echo "nothing to commit"; return 0; fi
              git commit -q -m "Speed bands ${1/T/ } SGT" -m "${2:-no summary}"
              for wait in 2 4 8 16 32; do
                git push -q origin HEAD:data-collect && return 0
                echo "push failed; retrying in ${wait} s on top of the latest data-collect"
                sleep "$wait"
                c=$(git rev-parse HEAD)
                git fetch -q --depth=1 --filter=blob:none origin data-collect
                git reset -q --hard FETCH_HEAD
                git cherry-pick "$c"
              done
              return 1 )
          }
          manifest="store/data/raw/speedbands/$DAY/manifest.csv"
          manifest2="store/data/raw/speedbands/$DAY2/manifest.csv"
          first="--first $FORCE"
          failed=0
          pulls=0
          while :; do
            set +e
            stamp=$(python code/src/collect.py next --start "$START" --until "$UNTIL" --every "$EVERY" --manifest "$manifest" "$manifest2" --grace "$GRACE" $first)
            rc=$?
            set -e
            [ "$rc" -eq 10 ] && break
            [ "$rc" -eq 0 ] || exit "$rc"
            first=""
            pulls=$((pulls + 1))
            if [ "$DRY_RUN" = true ]; then echo "dry run: pull $pulls would be stamped $stamp SGT"; continue; fi
            python code/src/collect.py once --out store --stamp "$stamp" || failed=1
            commit "$stamp" "$(sed -n 's/^summary=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          done
          echo "$pulls pull(s) in this run"
          exit "$failed"
